name: Army calculation correctness

on:
  push:
    paths:
      - 'assets/js/best_army.js'
      - 'assets/js/number-format.js'
      - 'assets/js/calculator-details.js'
      - 'best_army/index.html'
      - 'best_army/**'
      - 'soldiers/index.html'
      - 'machinery/index.html'
      - 'aeroplanes/index.html'
      - 'tests/**'
      - '.github/workflows/army-calculations.yml'
  pull_request:
    paths:
      - 'assets/js/best_army.js'
      - 'assets/js/number-format.js'
      - 'assets/js/calculator-details.js'
      - 'best_army/index.html'
      - 'best_army/**'
      - 'soldiers/index.html'
      - 'machinery/index.html'
      - 'aeroplanes/index.html'
      - 'tests/**'
      - '.github/workflows/army-calculations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/run-army-tests.cjs --stress
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r tests/requirements-army.txt
      - run: python tests/army-milp.py
